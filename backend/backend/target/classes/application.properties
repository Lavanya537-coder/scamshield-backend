# Server Port Configuration
server.port=5000

# H2 File-Based Database Configuration (Restart చేసినా డేటా పోదు)
spring.datasource.url=jdbc:h2:file:./data/scamshielddb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
spring.h2.console.settings.trace=false

# Spring Boot Frame Options Fix
spring.h2.console.settings.frame-options=sameorigin

